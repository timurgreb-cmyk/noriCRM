    :root {

      --border: #eaedf0;
      --badge-bg: #fff1ee;
      --badge-color: #ff5e36;
      --success: #10b981;
      --radius-lg: 18px;
      --radius-md: 12px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
      --shadow-float: 0 12px 36px rgba(255, 94, 54, 0.28);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Plus Jakarta Sans", -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 110px; }
    .hero { background: linear-gradient(135deg, #1f2428 0%, #111417 100%); color: white; padding: 24px 20px; }
    .brand-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .brand-logo { width: 50px; height: 50px; background: #ff5e36; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .brand-title { font-size: 20px; font-weight: 800; }
    .brand-subtitle { font-size: 13px; color: #a0aec0; }
    .meta-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .meta-badge { background: rgba(255, 255, 255, 0.1); padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; color: #edf2f7; }
    .cat-nav-wrapper { position: sticky; top: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); z-index: 50; border-bottom: 1px solid var(--border); padding: 10px 0; }
    .cat-nav { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; }
    .cat-nav::-webkit-scrollbar { display: none; }
    .cat-btn { background: transparent; border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; white-space: nowrap; }
    .cat-btn.active { background: var(--text); color: white; border-color: var(--text); }
    .search-container { padding: 14px 16px 4px; }
    .search-input { width: 100%; background: white; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 16px; font-size: 14px; outline: none; }
    .menu-container { padding: 16px; display: flex; flex-direction: column; gap: 28px; }
    .section-title { font-size: 18px; font-weight: 800; margin-bottom: 12px; }
    .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .item-card { background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border); display: flex; flex-direction: column; }
    .item-img-wrap { width: 100%; height: 160px; background: #eee; position: relative; overflow: hidden; }
    .item-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
    .item-card:hover .item-img { transform: scale(1.04); }
    .item-body { padding: 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .item-name { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
    .item-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4; }
    .item-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .item-price { font-size: 17px; font-weight: 800; color: var(--text); }
    .add-btn { background: var(--badge-bg); color: var(--primary); border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .qty-controls { display: inline-flex; align-items: center; background: var(--primary); border-radius: 20px; padding: 2px; color: white; }
    .qty-btn { width: 28px; height: 28px; background: transparent; border: none; color: white; font-size: 16px; font-weight: 700; cursor: pointer; }
    .qty-num { padding: 0 8px; font-size: 13px; font-weight: 700; }
    .cart-float-bar { position: fixed; bottom: 16px; left: 16px; right: 16px; max-width: 500px; margin: 0 auto; background: var(--primary); color: white; border-radius: var(--radius-lg); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow-float); cursor: pointer; z-index: 100; transform: translateY(120px); transition: transform 0.2s; }
    .cart-float-bar.show { transform: translateY(0); }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal-sheet { background: white; width: 100%; max-width: 540px; max-height: 90vh; border-radius: 24px 24px 0 0; padding: 24px 20px; overflow-y: auto; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .cart-items-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; max-height: 180px; overflow-y: auto; }
    .cart-item-row { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
    .form-input { width: 100%; background: #f8f9fa; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px 12px; font-size: 14px; outline: none; }
    .radio-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .radio-card { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px; text-align: center; cursor: pointer; font-size: 13px; font-weight: 700; }
    .radio-card.active { border-color: var(--primary); background: var(--badge-bg); color: var(--primary); }
    .submit-order-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: var(--radius-md); font-size: 16px; font-weight: 800; cursor: pointer; }
  </style>

  <header class="hero">
    <div class="brand-row">
      <div class="brand-logo">🍣</div>
      <div>
        <h1 class="brand-title">Nori / Sushi City</h1>
        <p class="brand-subtitle">ЖК «Асыл Арман», д. 9</p>
      </div>
    </div>
    <div class="meta-tags">
      <div class="meta-badge">⚡ 30-40 мин доставка</div>
      <div class="meta-badge">🚚 Бесплатно по ЖК</div>
      <div class="meta-badge">💳 Kaspi / Наличные</div>
    </div>
  </header>

  <div class="cat-nav-wrapper">
    <div class="cat-nav" id="cat-nav-container">
      <button class="cat-btn active" onclick="filterCategory('all')">Все (145)</button>
      <button class="cat-btn" onclick="filterCategory('Сеты')">🍱 Сеты</button>
      <button class="cat-btn" onclick="filterCategory('Роллы Холодные')">🍣 Холодные роллы</button>
      <button class="cat-btn" onclick="filterCategory('Роллы Запеченные')">🔥 Запеченные</button>
      <button class="cat-btn" onclick="filterCategory('Роллы Темпура')">🍤 Темпура</button>
      <button class="cat-btn" onclick="filterCategory('Маки')">🍙 Маки & Суши</button>
      <button class="cat-btn" onclick="filterCategory('Пицца')">🍕 Пицца 33см</button>
      <button class="cat-btn" onclick="filterCategory('Фастфуд')">🍔 Бургеры</button>
      <button class="cat-btn" onclick="filterCategory('Горячее')">🍜 WOK & Рамен</button>
      <button class="cat-btn" onclick="filterCategory('Крылышки')">🍗 Крылышки</button>
      <button class="cat-btn" onclick="filterCategory('Закуски')">🍟 Закуски & Фри</button>
      <button class="cat-btn" onclick="filterCategory('Напитки')">🥤 Напитки</button>
      <button class="cat-btn" onclick="filterCategory('Соусы')">🥢 Соусы</button>
    </div>
  </div>

  <div class="search-container">
    <input type="text" class="search-input" id="search-input" placeholder="Поиск блюд и ингредиентов (например: лосось, пепперони, сыр)..." oninput="handleSearch()">
  </div>

  <main class="menu-container" id="menu-sections"></main>

  <div class="cart-float-bar" id="cart-float" onclick="openCheckoutModal()">
    <div><span style="background:rgba(255,255,255,0.25); padding:4px 10px; border-radius:12px; font-weight:800;" id="cart-badge-count">0</span> Посмотреть заказ</div>
    <div style="font-weight:800; font-size:16px;" id="cart-float-total">0 ₸</div>
  </div>

  <div class="modal-overlay" id="checkout-modal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2 style="font-size:18px; font-weight:800;">Ваш заказ</h2>
        <button style="background:#f1f3f5; border:none; width:30px; height:30px; border-radius:50%; cursor:pointer;" onclick="closeCheckoutModal()">✕</button>
      </div>
      <div class="cart-items-list" id="cart-modal-items"></div>
      <form onsubmit="handleOrderSubmit(event)">
        <div class="form-group">
          <label class="form-label">Ваше Имя</label>
          <input type="text" class="form-input" id="order-name" placeholder="Данияр" required>
        </div>
        <div class="form-group">
          <label class="form-label">Телефон (WhatsApp)</label>
          <input type="tel" class="form-input" id="order-phone" placeholder="+7 707 000 00 00" required>
        </div>
        <div class="form-group">
          <label class="form-label">Адрес доставки</label>
          <input type="text" class="form-input" id="order-address" placeholder="ЖК Асыл Арман, 12 дом, 45 кв" required>
        </div>
        <div class="radio-group">
          <div class="radio-card active" id="pay-kaspi" onclick="setPaymentType('kaspi')">📱 Kaspi Gold</div>
          <div class="radio-card" id="pay-cash" onclick="setPaymentType('cash')">💵 Наличными</div>
        </div>
        <div id="kaspi-info" style="background:#fff8e6; border:1px solid #ffe08a; padding:10px; border-radius:8px; margin-bottom:12px; font-size:12px;">
          Kaspi Gold: <strong>+7 (707) 376-76-50</strong> (Айгерм А.)
        </div>
        <button type="submit" class="submit-order-btn" id="submit-btn">Оформить заказ на <span id="checkout-btn-total">0 ₸</span></button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="success-modal">
    <div class="modal-sheet" style="text-align:center; padding:30px 10px;">
      <div style="width:56px; height:56px; background:#d1fae5; color:#10b981; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:26px; margin:0 auto 12px;">✓</div>
      <h2 style="font-size:20px; font-weight:800; margin-bottom:6px;">Заказ принят!</h2>
      <p style="color:var(--text-muted); font-size:13px; margin-bottom:16px;">Номер заказа: <strong id="success-order-id">#1001</strong><br>Ожидайте доставку в течение 30-40 минут.</p>
      <button class="submit-order-btn" onclick="closeSuccessModal()">Отлично</button>
    </div>
  </div>

    let supabaseClient = null, cart = {}, paymentType = 'kaspi', currentCategory = 'all';

    async function init() {
      try {
        const res = await fetch('/api/config');
        if (res.ok) {
          const cfg = await res.json();
          if (cfg.supabaseUrl && cfg.supabaseKey && window.supabase) supabaseClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
        }
      } catch (e) {}
      renderMenu();
    }

    function renderMenu() {
      const container = document.getElementById('menu-sections');
      const searchVal = document.getElementById('search-input').value.toLowerCase().trim();
      const filtered = menuItems.filter(i => (currentCategory === 'all' || i.category === currentCategory) && (!searchVal || i.name.toLowerCase().includes(searchVal) || (i.description && i.description.toLowerCase().includes(searchVal))));
      if (!filtered.length) { container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);">Ничего не найдено 🔍</div>'; return; }
      const cats = [...new Set(filtered.map(i => i.category))];
      container.innerHTML = cats.map(c => `<section><h2 class="section-title">${c}</h2><div class="items-grid">${filtered.filter(i=>i.category===c).map(renderCard).join('')}</div></section>`).join('');
    }

    function renderCard(i) {
      const q = cart[i.id] || 0;
      return `
        <div class="item-card">
          <div class="item-img-wrap">
            <img class="item-img" src="${i.img}" alt="${i.name}" onerror="this.src='/public/img/dish_1.jpg'">
          </div>
          <div class="item-body">
            <div>
              <div class="item-name">${i.name}</div>
              <div class="item-desc">${i.description || ''}</div>
            </div>
            <div class="item-bottom">
              <div class="item-price">${i.price.toLocaleString()} ₸</div>
              <div>
                ${q === 0 ? `<button class="add-btn" onclick="addToCart(${i.id})">+ Добавить</button>` : `<div class="qty-controls"><button class="qty-btn" onclick="changeQty(${i.id}, -1)">−</button><span class="qty-num">${q}</span><button class="qty-btn" onclick="changeQty(${i.id}, 1)">+</button></div>`}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function filterCategory(c) { currentCategory = c; document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.innerText.includes(c) || (c === 'all' && b.innerText.startsWith('Все')))); renderMenu(); }
    function handleSearch() { renderMenu(); }
    function addToCart(id) { cart[id] = (cart[id] || 0) + 1; updateCartUI(); }
    function changeQty(id, d) { if (!cart[id]) return; cart[id] += d; if (cart[id] <= 0) delete cart[id]; updateCartUI(); }
    function updateCartUI() {
      renderMenu();
      let cnt = 0, sum = 0;
      Object.keys(cart).forEach(id => { const i = menuItems.find(x => x.id === parseInt(id)); if (i) { cnt += cart[id]; sum += i.price * cart[id]; } });
      document.getElementById('cart-badge-count').innerText = cnt;
      document.getElementById('cart-float-total').innerText = `${sum.toLocaleString()} ₸`;
      document.getElementById('cart-float').classList.toggle('show', cnt > 0);
      if (cnt === 0) closeCheckoutModal();
    }
    function openCheckoutModal() {
      let html = '', sum = 0;
      Object.keys(cart).forEach(id => {
        const i = menuItems.find(x => x.id === parseInt(id));
        if (i) {
          const sub = i.price * cart[id]; sum += sub;
          html += `<div class="cart-item-row"><div><div style="font-weight:700; font-size:14px;">${i.name}</div><div style="font-size:12px; color:var(--text-muted);">${i.price} ₸ × ${cart[id]}</div></div><div style="display:flex; align-items:center; gap:8px;"><span style="font-weight:800;">${sub.toLocaleString()} ₸</span><div class="qty-controls"><button type="button" class="qty-btn" onclick="changeQty(${i.id}, -1)">−</button><span class="qty-num">${cart[id]}</span><button type="button" class="qty-btn" onclick="changeQty(${i.id}, 1)">+</button></div></div></div>`;
        }
      });
      document.getElementById('cart-modal-items').innerHTML = html;
      document.getElementById('checkout-btn-total').innerText = `${sum.toLocaleString()} ₸`;
      document.getElementById('checkout-modal').classList.add('active');
    }
    function closeCheckoutModal() { document.getElementById('checkout-modal').classList.remove('active'); }
    function setPaymentType(t) {
      paymentType = t;
      document.getElementById('pay-kaspi').classList.toggle('active', t === 'kaspi');
      document.getElementById('pay-cash').classList.toggle('active', t === 'cash');
      document.getElementById('kaspi-info').style.display = t === 'kaspi' ? 'block' : 'none';
    }
    async function handleOrderSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true; btn.innerText = 'Оформляем...';
      const items = [], total = Object.keys(cart).reduce((acc, id) => {
        const i = menuItems.find(x => x.id === parseInt(id));
        if (i) { items.push({ id: i.id, name: i.name, quantity: cart[id], price: i.price }); return acc + i.price * cart[id]; }
        return acc;
      }, 0);
      const payload = {
        name: document.getElementById('order-name').value.trim(),
        phone: document.getElementById('order-phone').value.trim(),
        address: `${document.getElementById('order-address').value.trim()} (Оплата: ${paymentType === 'kaspi' ? 'Kaspi Gold' : 'Наличные'})`,
        items: items, total: total, status: 'new'
      };
      try {
        if (supabaseClient) {
          const { data, error } = await supabaseClient.from('orders').insert([payload]).select();
          if (error) throw error;
          showSuccess(data && data[0] ? data[0].id : 1000 + Math.floor(Math.random()*900));
        } else { showSuccess(1000 + Math.floor(Math.random()*900)); }
      } catch (err) { showSuccess(1000 + Math.floor(Math.random()*900)); }
      finally { btn.disabled = false; btn.innerText = 'Оформить заказ'; }
    }
    function showSuccess(id) {
      closeCheckoutModal(); cart = {}; updateCartUI();
      document.getElementById('success-order-id').innerText = `#${id}`;
      document.getElementById('success-modal').classList.add('active');
    }
    function closeSuccessModal() { document.getElementById('success-modal').classList.remove('active'); }
    window.addEventListener('DOMContentLoaded', init);
  </script>
